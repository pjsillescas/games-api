version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: games-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: games-db
      MYSQL_USER: games
      MYSQL_PASSWORD: games
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"

volumes:
  mysql-data:
